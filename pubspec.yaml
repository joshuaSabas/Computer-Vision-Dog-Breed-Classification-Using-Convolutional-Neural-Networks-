name: dog_breed_classifier
description: A dog breed classification app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  image_picker: ^1.0.4
  tflite_flutter: ^0.11.0 # <-- INAYOS KO ITO (dating 0.10.4)
  image: ^4.1.3
  path_provider: ^2.1.0
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_unquant.tflite
    - assets/models/labels.txt
    - assets/images/
