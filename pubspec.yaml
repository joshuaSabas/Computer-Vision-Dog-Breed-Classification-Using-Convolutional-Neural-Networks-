name: dog_breed_classifier
description: A dog breed classification app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0' # Inayos ko ang SDK version

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  image_picker: ^1.0.4
  tflite_flutter: ^0.10.4
  image: ^4.1.3
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # BINABA KO ANG VERSION DITO PARA TUMUGMA SA DART 3.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_unquant.tflite
    - assets/models/labels.txt
